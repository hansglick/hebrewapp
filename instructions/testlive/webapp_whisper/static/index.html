<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Testlive — Conversation en direct (verbatim user via Whisper)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
      text-align: center;
      color: #1a1a1a;
    }
    h1 { font-size: 1.3em; }
    p.muted { color: #666; font-size: 0.9em; }
    button {
      font-size: 1.1em;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      margin-top: 24px;
    }
    button.start { background: #16a34a; color: #fff; }
    button.stop { background: #dc2626; color: #fff; }
    button:disabled { opacity: 0.5; cursor: default; }
    #status {
      margin-top: 20px;
      font-weight: 600;
      min-height: 1.4em;
    }
    #currentAi {
      margin-top: 24px;
      text-align: right;
      direction: rtl;
      border: 1px solid #bcd6ff;
      background: #f0f6ff;
      border-radius: 8px;
      padding: 10px 16px;
      min-height: 1.4em;
      font-size: 0.9em;
      color: #1a3a6b;
    }
    #currentAi .label {
      display: block;
      text-align: left;
      direction: ltr;
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
      color: #6b8fc9;
      margin-bottom: 2px;
    }
    #log {
      margin-top: 12px;
      text-align: right;
      direction: rtl;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      min-height: 60px;
      max-height: 240px;
      overflow-y: auto;
      font-size: 0.85em;
      color: #444;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🎙️ Conversation en direct — verbatim user via Whisper</h1>
  <p class="muted">
    Voix + verbatim IA : Gemini Live. Verbatim de l'étudiant : Whisper
    (transcription brute, sans correction grammaticale), pour repérer ses
    vraies erreurs. Casque conseillé pour éviter le larsen.
  </p>

  <button id="toggleBtn" class="start">Démarrer la conversation</button>
  <div id="status">Prêt.</div>
  <div id="currentAi"><span class="label">Dernière intervention IA</span>…</div>
  <div id="log"></div>

  <script>
    const toggleBtn = document.getElementById("toggleBtn");
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");

    const currentAiEl = document.getElementById("currentAi");

    let ws = null;
    let micContext = null;
    let micStream = null;
    let processor = null;
    let playbackContext = null;
    let nextPlaybackTime = 0;
    let running = false;

    // Verbatim IA : deltas accumulés par tour jusqu'à turn_complete.
    // Verbatim user : un seul message complet par tour, avec retard
    // possible (Whisper est plus lent que le flux Gemini). `history`
    // contient {speaker, text, ts} et est retriée par ts à chaque ajout,
    // pour que le journal reste chronologique même si un verbatim user
    // arrive après une réponse IA plus récente.
    let aiBuffer = "";
    let lastCompletedAiText = "";
    const history = [];

    function addToHistory(speaker, text, ts) {
      history.push({ speaker, text, ts });
      history.sort((a, b) => a.ts - b.ts);
      renderLog();
    }

    function renderLog() {
      const icon = { user: "🧑", ai: "🤖", error: "⚠️" };
      const lines = history.map((entry) => `${icon[entry.speaker]} ${entry.text}`);
      logEl.textContent = lines.join("\n");
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Zone du haut : dernière intervention IA, mise à jour en direct pendant
    // qu'elle est prononcée (indépendante du tri chronologique du journal),
    // et qui reste affichée telle quelle une fois le tour terminé (jusqu'à
    // la prochaine intervention IA).
    function renderCurrentAi() {
      currentAiEl.innerHTML =
        '<span class="label">Dernière intervention IA</span>' + (aiBuffer || lastCompletedAiText || "…");
    }

    function flushAiTranscript(ts) {
      if (aiBuffer) {
        addToHistory("ai", aiBuffer, ts);
        lastCompletedAiText = aiBuffer;
        aiBuffer = "";
        renderCurrentAi();
      }
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    // Downsample Float32 samples from `inRate` to 16000 Hz and convert to
    // Int16 PCM — format attendu par Gemini Live (audio/pcm).
    function floatTo16kPCM(float32, inRate) {
      const outRate = 16000;
      const ratio = inRate / outRate;
      const outLength = Math.floor(float32.length / ratio);
      const out = new Int16Array(outLength);
      for (let i = 0; i < outLength; i++) {
        const srcIndex = Math.floor(i * ratio);
        let sample = float32[srcIndex];
        sample = Math.max(-1, Math.min(1, sample));
        out[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
      }
      return out;
    }

    function int16ToBase64(int16) {
      const bytes = new Uint8Array(int16.buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function base64ToInt16(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Int16Array(bytes.buffer);
    }

    // Joue un chunk PCM16 24kHz reçu de Gemini, mis bout à bout sans trou
    // ni chevauchement via un curseur de temps de lecture planifié.
    function playChunk(int16) {
      if (!playbackContext) {
        playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        nextPlaybackTime = playbackContext.currentTime;
      }
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;

      const buffer = playbackContext.createBuffer(1, float32.length, 24000);
      buffer.copyToChannel(float32, 0);

      const source = playbackContext.createBufferSource();
      source.buffer = buffer;
      source.connect(playbackContext.destination);

      const startAt = Math.max(nextPlaybackTime, playbackContext.currentTime);
      source.start(startAt);
      nextPlaybackTime = startAt + buffer.duration;
    }

    async function start() {
      running = true;
      toggleBtn.textContent = "Arrêter";
      toggleBtn.className = "stop";
      setStatus("Connexion...");

      ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onopen = async () => {
        setStatus("Connecté — parle en hébreu !");
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setStatus("Micro refusé : " + e.message);
          stop();
          return;
        }
        micContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = micContext.createMediaStreamSource(micStream);
        processor = micContext.createScriptProcessor(4096, 1, 1);
        processor.onaudioprocess = (e) => {
          if (!running || ws.readyState !== WebSocket.OPEN) return;
          const input = e.inputBuffer.getChannelData(0);
          const pcm16k = floatTo16kPCM(input, micContext.sampleRate);
          ws.send(JSON.stringify({ type: "audio", data: int16ToBase64(pcm16k) }));
        };
        source.connect(processor);
        processor.connect(micContext.destination);
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "audio") {
          playChunk(base64ToInt16(msg.data));
        } else if (msg.type === "ai_transcript") {
          aiBuffer += msg.text;
          renderCurrentAi();
        } else if (msg.type === "turn_complete") {
          flushAiTranscript(msg.ts);
        } else if (msg.type === "user_transcript_final") {
          // Whisper renvoie le tour complet d'un coup (pas de streaming) —
          // arrive avec un léger délai après la fin du tour de l'étudiant ;
          // msg.ts (horodaté au début de ce tour, pas à la réception) le
          // replace à sa vraie place chronologique dans le journal.
          addToHistory("user", msg.text, msg.ts);
        } else if (msg.type === "error") {
          setStatus("Erreur : " + msg.message);
          addToHistory("error", msg.message, Date.now() / 1000);
        }
      };

      ws.onerror = () => setStatus("Erreur de connexion WebSocket.");
      ws.onclose = () => {
        if (running) setStatus("Connexion fermée.");
      };
    }

    function stop() {
      running = false;
      toggleBtn.textContent = "Démarrer la conversation";
      toggleBtn.className = "start";
      setStatus("Arrêté.");

      if (processor) { processor.disconnect(); processor = null; }
      if (micContext) { micContext.close(); micContext = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
      if (ws) { ws.close(); ws = null; }
      if (playbackContext) { playbackContext.close(); playbackContext = null; }
    }

    toggleBtn.addEventListener("click", () => {
      if (running) stop();
      else start();
    });
  </script>
</body>
</html>
